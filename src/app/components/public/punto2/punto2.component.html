<div class="container">
  <h2>
    Productos Destacados
    <button type="button" class="btn btn-primary float-end" data-bs-toggle="modal" data-bs-target="#carritoModal">
      Ver Carrito ({{ carrito.length }})
    </button>
  </h2>

  <div class="row">
    <div class="col-md-4" *ngFor="let producto of productos">
      <div class="card mb-4 shadow-sm">
        <img class="card-img-top" [src]="producto.img" alt="{{ producto.nombre }}">
        <div class="card-body">
          <h4 class="card-title">{{ producto.nombre }}</h4>
          <p class="card-text">{{ producto.descripcion }}</p>
          <div class="d-flex justify-content-between align-items-center">
            <div class="btn-group">
              <button type="button" class="btn btn-sm btn-outline-secondary">Ver</button>
              <button type="button" class="btn btn-sm btn-primary" (click)="agregarAlCarrito(producto)">Agregar al Carrito</button>
            </div>
            <small class="text-muted">{{ producto.precio | currency:'USD':'symbol':'1.2-2' }}</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="carritoModal" tabindex="-1" aria-labelledby="carritoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="carritoModalLabel">Carrito de Compras</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let item of carrito">
              {{ item.nombre }}
              <span class="badge bg-primary rounded-pill">{{ item.precio | currency:'USD':'symbol':'1.2-2' }}</span>
            </li>
          </ul>
          <h5 class="mt-3">Total: {{ calcularTotal() | currency:'USD':'symbol':'1.2-2' }}</h5>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="button" class="btn btn-primary">Proceder al Pago</button>
        </div>
      </div>
    </div>
  </div>

</div>
